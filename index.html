<style>
  :root{
    --bg:#0b0b10; --bg2:#12121a; --card:rgba(255,255,255,.04); --border:rgba(255,255,255,.09);
    --text:#e7e7ee; --muted:#9a9aac; --accent:#3b82f6; --accent2:#8b5cf6; --green:#34d399;
    --radius:16px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    background:linear-gradient(160deg,#0b0b10 0%,#14101f 45%,#1c1430 100%);
    color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased; line-height:1.6;
  }
  a{color:var(--accent);text-decoration:none}
  .wrap{max-width:1080px;margin:0 auto;padding:0 24px}

  /* ---- nav ---- */
  nav{position:sticky;top:0;z-index:50;backdrop-filter:blur(14px);background:rgba(11,11,16,.7);border-bottom:1px solid var(--border)}
  nav .wrap{display:flex;align-items:center;gap:28px;height:60px}
  .logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;color:var(--text)}
  .logo .mark{width:28px;height:28px;border-radius:7px;object-fit:contain;display:block;box-shadow:0 1px 6px rgba(0,0,0,.45)}
  nav .links{display:flex;gap:22px;margin-left:auto}
  nav .links a{color:var(--muted);font-size:14px;transition:color .2s}
  nav .links a:hover{color:var(--text)}
  .lang{display:flex;gap:4px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:3px}
  .lang button{border:0;background:transparent;color:var(--muted);font-size:12px;padding:4px 8px;border-radius:6px;cursor:pointer}
  .lang button.on{background:rgba(59,130,246,.25);color:#fff}
  .dl{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:600;font-size:14px;padding:8px 16px;border-radius:9px;white-space:nowrap}
  .dl:hover{filter:brightness(1.1)}
  @media(max-width:860px){nav .links{display:none}}
  @media(max-width:560px){
    nav .wrap{height:56px;gap:8px}
    .logo{font-size:15px}.logo .mark{width:24px;height:24px}
    .lang{padding:2px}.lang button{font-size:11px;padding:3px 6px}
    .dl{font-size:12px;padding:7px 10px}
    .hero{padding:64px 0 48px}.sub{font-size:16px}
    section{padding:64px 0}
  }
  @media(max-width:380px){.dl{display:none}}

  /* ---- hero ---- */
  .hero{padding:96px 0 72px;text-align:center}
  .badge{display:inline-flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);border:1px solid var(--border);background:var(--card);border-radius:99px;padding:6px 16px}
  .badge .dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
  h1{font-size:clamp(28px,4.6vw,46px);font-weight:800;letter-spacing:-.02em;margin:22px 0 14px;line-height:1.12;white-space:nowrap}
  @media(max-width:520px){h1{white-space:normal;font-size:25px}}  /* 极窄屏允许换行，防溢出 */
  h1 .grad{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{max-width:640px;margin:0 auto;color:var(--muted);font-size:18px}
  .keys{display:flex;gap:8px;justify-content:center;margin:30px 0 26px}
  .key{min-width:44px;padding:8px 14px;border-radius:9px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-bottom-width:3px;font-family:ui-monospace,Menlo,monospace;font-size:18px;color:#fff;box-shadow:0 2px 12px rgba(0,0,0,.4)}
  .cta-row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
  .cta{padding:13px 26px;border-radius:11px;font-weight:600;font-size:15px}
  .cta.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
  .cta.ghost{border:1px solid var(--border);color:var(--text);background:var(--card)}
  .trust{margin-top:18px;font-size:13px;color:var(--muted)}
  .trust span{margin:0 10px}

  /* ---- panel mock ---- */
  .mock-area{margin:56px auto 0;width:100%;max-width:880px;perspective:1400px}
  .panel{display:flex;width:100%;max-width:min(780px,100%);margin:0 auto;aspect-ratio:760/560;border-radius:18px;overflow:hidden;
    border:1px solid rgba(255,255,255,.14);background:#17171f;box-shadow:0 40px 90px rgba(0,0,0,.55),0 0 0 1px rgba(0,0,0,.4);
    text-align:left;transform:rotateX(4deg);transition:transform .6s}
  .mock-area:hover .panel{transform:rotateX(0)}
  .panel .list{flex:1.05;border-right:1px solid rgba(255,255,255,.07);display:flex;flex-direction:column;min-width:0}
  .p-search{margin:12px;padding:8px 12px;border-radius:9px;background:rgba(255,255,255,.06);color:var(--muted);font-size:13px}
  .p-filters{display:flex;gap:6px;padding:0 12px 8px;font-size:11px}
  .p-filters span{padding:4px 10px;border-radius:99px;color:var(--muted);background:rgba(255,255,255,.05)}
  .p-filters span.on{background:rgba(59,130,246,.3);color:#dbeafe}
  .p-row{display:flex;gap:10px;align-items:center;padding:9px 12px;border-left:2px solid transparent}
  .p-row .ic{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;font-size:12px;color:#c9c9d6;flex-shrink:0}
  .p-row .tx{min-width:0;flex:1}
  .p-row .l1{font-size:12.5px;color:#dcdce6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .p-row .l2{font-size:10.5px;color:#82828f}
  .p-row.sel{background:rgba(59,130,246,.14);border-left-color:var(--accent)}
  .p-foot{margin-top:auto;padding:9px 14px;font-size:11px;color:#82828f;border-top:1px solid rgba(255,255,255,.07);display:flex;justify-content:space-between}
  .panel .preview{flex:1;display:flex;flex-direction:column;background:#0e0e14}
  .ph-img{flex:1;margin:14px;border-radius:12px;background:
    radial-gradient(120% 120% at 20% 15%,#4f79b8 0%,transparent 55%),
    radial-gradient(120% 120% at 85% 80%,#7c5cbf 0%,transparent 55%),
    linear-gradient(140deg,#2a3550,#3d2f57);position:relative;overflow:hidden}
  .ph-img::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.35),transparent 40%)}
  .ph-cap{padding:0 16px 14px;font-size:11.5px;color:#9a9aac;display:flex;align-items:center;gap:8px}
  .ph-cap .kbd{font-size:10px;border:1px solid rgba(255,255,255,.25);border-radius:5px;padding:1px 6px;font-family:ui-monospace,monospace;color:#dcdce6}
  @media(max-width:960px){.panel,.mock-area:hover .panel{transform:none!important}}
  @media(max-width:720px){.panel{aspect-ratio:auto;flex-direction:column}.panel .list{border-right:0;border-bottom:1px solid rgba(255,255,255,.07)}.ph-img{min-height:180px}}

  /* ---- sections ---- */
  section{padding:88px 0;scroll-margin-top:76px}  /* 锚点跳转时不被悬浮导航遮住 */
  section h2{font-size:clamp(26px,4vw,38px);font-weight:800;letter-spacing:-.01em;text-align:center}
  section .sec-sub{text-align:center;color:var(--muted);margin:12px auto 48px;max-width:560px;font-size:16px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
  @media(max-width:860px){.grid{grid-template-columns:1fr 1fr}}
  @media(max-width:560px){.grid{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:26px;transition:transform .25s,border-color .25s}
  .card:hover{transform:translateY(-3px);border-color:rgba(59,130,246,.45)}
  .card .fic{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;margin-bottom:16px;color:#e9e9f2}
  .card h3{font-size:16.5px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:8px}
  .card p{color:var(--muted);font-size:14px}
  .tag{font-size:10px;font-weight:700;letter-spacing:.05em;padding:2px 8px;border-radius:99px}
  .tag.free{background:rgba(52,211,153,.15);color:var(--green);border:1px solid rgba(52,211,153,.3)}
  .tag.pro{background:rgba(139,92,246,.15);color:#c4b5fd;border:1px solid rgba(139,92,246,.3)}

  /* shortcuts table */
  section.band{position:relative}
  section.band::before{content:"";position:absolute;top:0;bottom:0;left:calc(50% - 50vw);right:calc(50% - 50vw);
    background:rgba(255,255,255,.022);border-top:1px solid var(--border);border-bottom:1px solid var(--border);z-index:-1}
  .sc-table{max-width:640px;margin:0 auto}
  .sc-row{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--border)}
  .sc-row:last-child{border-bottom:0}
  .sc-row .desc{font-size:15px;color:var(--text)}
  .sc-row .keys{margin:0;gap:6px}
  .sc-row .key{min-width:34px;padding:5px 11px;font-size:14px}

  /* privacy */
  .priv{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
  @media(max-width:860px){.priv{grid-template-columns:1fr}}
  .priv .card{text-align:center}
  .priv .fic{margin:0 auto 16px}

  /* pricing */
  .price-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:760px;margin:0 auto}
  @media(max-width:680px){.price-grid{grid-template-columns:1fr}}
  .price{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:32px}
  .price.pro{border-color:rgba(139,92,246,.5);background:linear-gradient(180deg,rgba(139,92,246,.08),rgba(59,130,246,.05))}
  .price .name{font-size:14px;font-weight:700;letter-spacing:.06em;color:var(--muted)}
  .price .big{font-size:34px;font-weight:800;margin:8px 0 20px}
  .price .big small{font-size:14px;font-weight:500;color:var(--muted)}
  .price ul{list-style:none;margin-bottom:22px}
  .price li{padding:7px 0;color:var(--muted);font-size:14.5px;display:flex;gap:10px;align-items:baseline}
  .price li::before{content:"✓";color:var(--green);font-weight:700}
  .price li.na{opacity:.45}.price li.na::before{content:"—";color:var(--muted)}
  .pro-note{text-align:center;color:var(--muted);font-size:13px;margin-top:22px}

  /* faq */
  .faq{max-width:700px;margin:0 auto}
  details{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:12px;padding:0 20px}
  details summary{cursor:pointer;padding:17px 0;font-weight:600;font-size:15px;list-style:none;display:flex;justify-content:space-between;align-items:center}
  details summary::after{content:"+";color:var(--accent);font-size:20px}
  details[open] summary::after{content:"–"}
  details p{padding:0 0 17px;color:var(--muted);font-size:14.5px}

  footer{border-top:1px solid var(--border);padding:34px 0;color:var(--muted);font-size:13px}
  footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}

  /* 只做位移不做透明度：任何时刻（截图/慢加载/动画中断）内容都可见 */
  .reveal{transform:translateY(16px);transition:transform .6s ease}
  .reveal.in{opacity:1;transform:none}
  @media(prefers-reduced-motion:reduce){.reveal,.reveal.in{transform:none;transition:none}.panel,.mock-area:hover .panel{transform:none}}
</style>
</head>

const LS_KEY="kc_site_lang";
function apply(lang){
  const d=I18N[lang]; if(!d) return;
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-i18n]").forEach(el=>{const k=el.getAttribute("data-i18n"); if(d[k]!==undefined) el.textContent=d[k];});
  document.querySelectorAll("#lang button").forEach(b=>b.classList.toggle("on",b.dataset.lang===lang));
  try{localStorage.setItem(LS_KEY,lang)}catch(e){}
}
(function(){
  let lang=null;
  try{lang=localStorage.getItem(LS_KEY)}catch(e){}
  if(!lang){const n=(navigator.language||"en").toLowerCase();
    lang=n.startsWith("zh")?"zh":n.startsWith("ja")?"ja":n.startsWith("ko")?"ko":"en";}
  apply(lang);
  document.getElementById("lang").addEventListener("click",e=>{
    if(e.target.dataset.lang) apply(e.target.dataset.lang);
  });
})();
/* scroll reveal —— 带兜底：无 IO 支持或 1.2s 内未触发时全部显示，
   避免任何情况下内容因动画而不可见 */
const reveals=document.querySelectorAll(".reveal");
if ("IntersectionObserver" in window){
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.12});
  reveals.forEach(el=>io.observe(el));
  setTimeout(()=>reveals.forEach(el=>el.classList.add("in")),1200);
} else {
  reveals.forEach(el=>el.classList.add("in"));
}
